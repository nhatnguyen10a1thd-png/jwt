<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ — SecureAuth</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Background -->
<div class="bg-pattern">
    <div class="bg-line"></div>
    <div class="bg-line"></div>
    <div class="bg-line"></div>
</div>

<!-- Navbar -->
<nav class="navbar">
    <a href="/" class="brand">
        <div class="brand-mark">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/>
            </svg>
        </div>
        <div class="brand-text">Secure<span>Auth</span></div>
    </a>
    <button id="logout" class="btn-logout">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
        </svg>
        Đăng xuất
    </button>
</nav>

<!-- Profile -->
<div class="page-wrapper" style="padding-top:100px; align-items:flex-start;">
    <div class="profile-container">

        <!-- Hero -->
        <div class="card profile-hero">
            <div class="hero-banner">
                <div class="pattern"></div>
                <div class="accent-line"></div>
            </div>
            <div class="hero-body">
                <div class="avatar-frame">
                    <img id="images" src="/images/profile.png" alt="Avatar">
                    <div class="status-dot"></div>
                </div>
                <div class="hero-info">
                    <h1 id="profileName">Đang tải...</h1>
                    <div class="subtitle">
                        <span class="badge-verified">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                            Đã xác thực
                        </span>
                        Tài khoản hoạt động
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="card stat-tile">
                <div class="tile-icon navy">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></svg>
                </div>
                <div class="tile-label">Mã tài khoản</div>
                <div id="userId" class="tile-value">—</div>
            </div>
            <div class="card stat-tile">
                <div class="tile-icon gold">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/></svg>
                </div>
                <div class="tile-label">Email</div>
                <div id="userEmail" class="tile-value">—</div>
            </div>
            <div class="card stat-tile">
                <div class="tile-icon slate">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>
                </div>
                <div class="tile-label">Ngày đăng ký</div>
                <div id="userCreated" class="tile-value">—</div>
            </div>
            <div class="card stat-tile">
                <div class="tile-icon emerald">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                </div>
                <div class="tile-label">Trạng thái</div>
                <div class="tile-value"><span class="tag tag-green">● Hoạt động</span></div>
            </div>
        </div>

        <!-- Detail -->
        <div class="card detail-section">
            <h2 class="section-title">Thông tin chi tiết</h2>
            <div class="info-row">
                <span class="info-label">Họ và tên</span>
                <span id="detailName" class="info-value">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Email</span>
                <span id="detailEmail" class="info-value">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Mã tài khoản</span>
                <span id="detailId" class="info-value">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Ngày tạo</span>
                <span id="detailCreated" class="info-value">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Cập nhật cuối</span>
                <span id="detailUpdated" class="info-value">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Bảo mật</span>
                <span class="info-value"><span class="tag tag-gold">◆ JWT Token hợp lệ</span></span>
            </div>
        </div>

        <div class="page-footer">
            Spring Boot REST API — Powered by <span>Spring Security 6</span> &amp; JWT
        </div>
    </div>
</div>

<div id="profile" style="display:none;"></div>
<div id="feedback" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
